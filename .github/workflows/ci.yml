name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: Lint + Test ────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge_test
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, pcntl, bcmath, redis
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - name: Install Dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        working-directory: apps/api
        run: cp .env.testing.example .env.testing

      - name: Generate App Key
        working-directory: apps/api
        run: php artisan key:generate --env=testing

      - name: Run Migrations
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_DATABASE: flowforge_test
          DB_USERNAME: flowforge
          DB_PASSWORD: secret
        run: php artisan migrate --env=testing --force

      - name: Run Linter (Pint)
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Run Tests
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_DATABASE: flowforge_test
          DB_USERNAME: flowforge
          DB_PASSWORD: secret
          REDIS_HOST: localhost
        run: php artisan test --coverage --min=60

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml

  # ── Frontend: Lint + Build ──────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Type Check
        working-directory: apps/web
        run: npm run tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build

  # ── Docker Build (hanya di main) ────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
