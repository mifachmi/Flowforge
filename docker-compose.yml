services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flowforge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowforge_local
      POSTGRES_USER: fardhana24
      POSTGRES_PASSWORD: 
    volumes:
      - pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowforge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ── Backend (Laravel) ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: flowforge_api
    restart: unless-stopped
    env_file: ./apps/api/.env.docker
    environment:
      DB_HOST: postgres
      DB_DATABASE: flowforge
      DB_USERNAME: flowforge
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    volumes:
      - api_storage:/var/www/html/storage/app
      - api_logs:/var/www/html/storage/logs
    ports:
      - "8000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React) ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    container_name: flowforge_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  # ── Database Migrations (one-shot) ──────────────────────────────────────────
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: flowforge_migrate
    env_file: ./apps/api/.env.docker
    environment:
      DB_HOST: postgres
      DB_DATABASE: flowforge
      DB_USERNAME: flowforge
      DB_PASSWORD: secret
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  horizon:
    build: .
    command: php artisan horizon
    depends_on:
      - postgres
      - redis
    env_file: .env

volumes:
  pg:
  api_storage:
  api_logs: